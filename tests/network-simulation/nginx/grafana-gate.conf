# Stands in for the real Azure NSG rule ("only the WireGuard IP range may
# reach Grafana's port"). Locally there's no NSG to test against, so this
# nginx gate simulates it: only requests whose source IP falls in
# net-vpn-sim's subnet are proxied through to Grafana; everything else
# (including net-public-sim, standing in for the public internet) gets 403.
# See tests/network-simulation/README.md.

server {
    listen 3000;

    location / {
        allow 172.30.2.0/24; # net-vpn-sim
        deny all;

        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
    }
}
