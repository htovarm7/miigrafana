# Local stand-in for the Azure network boundaries. Run via run-test.sh.
services:
  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - net-vnet-sim

  grafana:
    image: grafana/grafana-oss:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - net-vnet-sim

  # Public gateway: reachable from the "internet", forwards only with a valid token.
  gateway:
    image: nginx:1.27-alpine
    environment:
      - GATEWAY_API_KEY=network-sim-key
    volumes:
      - ../../observability/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - net-vnet-sim
      - net-public-sim

  # Stands in for the NSG rule: only the VPN subnet may reach Grafana.
  grafana-gate:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/grafana-gate.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - grafana
    networks:
      - net-vnet-sim
      - net-vpn-sim
      - net-public-sim

networks:
  net-vnet-sim: # Azure VNet
    ipam:
      config:
        - subnet: 172.30.1.0/24
  net-vpn-sim: # WireGuard admin clients
    ipam:
      config:
        - subnet: 172.30.2.0/24
  net-public-sim: # public internet
    ipam:
      config:
        - subnet: 172.30.3.0/24
