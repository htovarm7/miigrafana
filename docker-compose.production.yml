services:
  gateway:
    ports:
      - "8081:8080"

  # Only reachable through the gateway's /collect route in production - not
  # published on any public or VNet interface. Container-to-container
  # traffic (gateway -> alloy) uses the internal Docker network regardless
  # of this binding; loopback-only just keeps the host itself from exposing
  # it directly.
  alloy:
    ports:
      - "127.0.0.1:12347:12347"

  loki:
    ports:
      - "${PRIVATE_IP}:3100:3100"
  prometheus:
    ports:
      - "${PRIVATE_IP}:9090:9090"

  grafana:
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${PRIVATE_IP}:3000:3000"
