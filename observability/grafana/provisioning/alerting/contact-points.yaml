apiVersion: 1

# Slack as a Grafana Alerting contact point. See OBSERVABILIDAD.md, "Alerting:
# Slack as a contact point" for what to request from whoever owns the Slack
# workspace, and how to test it.
#
# $SLACK_WEBHOOK_URL is interpolated by Grafana's own provisioning at
# startup (native $variable syntax, no custom envsubst step needed) - set it
# via the "grafana" service's environment in docker-compose.*.yml, never
# hardcoded here. If it's unset, this provisions a contact point with an
# empty URL - Grafana starts fine, the contact point just won't deliver
# anything until the env var is set.
contactPoints:
  - orgId: 1
    name: Slack - MiiCel alerts
    receivers:
      - uid: slack-miicel-alerts
        type: slack
        settings:
          # Incoming Webhook URL method - see OBSERVABILIDAD.md for how to
          # get this. No "token"/"recipient" needed with this method; the
          # target channel is already baked into the webhook URL itself.
          url: $SLACK_WEBHOOK_URL
          username: Grafana (MiiCel)
          icon_emoji: ":rotating_light:"
          title: |
            {{ template "slack.default.title" . }}
          text: |
            {{ template "slack.default.text" . }}
