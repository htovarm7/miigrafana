apiVersion: 1

# One provider/folder per area, matching observability/grafana/dashboards/<dir>/.
providers:
  - name: MiiCel General
    orgId: 1
    folder: "MiiCel - General"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/general

  - name: MiiCaja Mobile
    orgId: 1
    folder: "MiiCaja Mobile"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/mobile-app

  - name: MiiCel API Users
    orgId: 1
    folder: "MiiCel API - Users"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/users

  - name: MiiCel API Management
    orgId: 1
    folder: "MiiCel API - Management"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/management
