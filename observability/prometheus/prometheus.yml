global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Targets: host.docker.internal:<port> for `dotnet run` on the host;
# switch to <compose-service>:8080 (e.g. miicel.api.users:8080) when the APIs run in Docker.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: miicel-api-management
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5011"]
        labels:
          app: miicel-api-management
  - job_name: miicel-api-users
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          app: miicel-api-users
