global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: miicel-api-management
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5011"]
        labels:
          app: miicel-api-management
