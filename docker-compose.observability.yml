services:
  # Public token-gated entrypoint for external log sources (mobile app).
  gateway:
    image: nginx:1.27-alpine
    container_name: miicel-gateway
    environment:
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:-dev-local-only-key}
    volumes:
      - ./observability/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8081:8080"
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.2.1
    container_name: miicel-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3200:3100" # host 3200: 3100 is inside a Windows excluded port range
    networks:
      - default
      - miivida_vnet

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: miicel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - default
      - miivida_vnet

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: miicel-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # local only, disabled in production overlay
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - prometheus
    networks:
      - default
      - miivida_vnet

volumes:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  default: {}
  miivida_vnet:
    external: true # shared with MiiCelBack; create once: docker network create miivida_vnet
